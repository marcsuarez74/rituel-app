# Après une fusion sur main : release-please ouvre/maintient la PR « chore(main): release x.y.z »
# (version déduite des conventional commits, CHANGELOG généré). Fusionner cette PR pose le
# tag v<version> et crée la GitHub Release. Le déploiement est fait par le VPS, qui suit main
# (deploy/deploy.sh) — aucun secret ici : GITHUB_TOKEN suffit.
# Prérequis réglage dépôt : Settings › Actions › General › « Allow GitHub Actions to create
# and approve pull requests ».
name: Publier
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
