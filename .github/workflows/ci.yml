name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Prepare
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Server — install
        run: npm ci
        working-directory: server
      - name: Server — check (typecheck + lint + test)
        run: npm run check
        working-directory: server
      - name: Navigateurs e2e (Playwright)
        run: |
          # Le miroir apt google-chrome du runner peut être incohérent (hash sum
          # mismatch) ; Playwright télécharge ses propres navigateurs.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          npx playwright install --with-deps chromium webkit
      - name: Test e2e (build de prod, mobile 320/375)
        run: npm run e2e:preview
      - name: Image Docker (PWA + API, better-sqlite3 natif)
        run: docker build -t rituel:ci .
