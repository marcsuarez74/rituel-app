# Après une fusion sur main : tag v<version de package.json> (s'il manque) puis
# Release GitHub. Le déploiement lui-même est fait par le VPS, qui suit main
# (deploy/deploy.sh, timer systemd toutes les 2 min) — aucun secret ici.
name: Publier
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    name: Tag de version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Poser le tag v<version> s'il manque
        id: tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG existe déjà (version non incrémentée) — rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  release:
    name: Release GitHub
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
