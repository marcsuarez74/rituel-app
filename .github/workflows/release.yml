# Release GitHub d'un tag v* : notes extraites de la section du CHANGELOG.
# Appelé par publier.yml après une fusion sur main (un tag poussé par
# GITHUB_TOKEN ne déclenche aucun workflow, d'où l'appel explicite), ou déclenché
# par un tag poussé à la main.
name: Release
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extraire les notes du CHANGELOG
        run: |
          VERSION="${TAG#v}"
          NOTES="${RUNNER_TEMP}/notes-${VERSION}.md"
          awk -v ver="$VERSION" '
            BEGIN { pat = "## [" ver "]" }
            index($0, pat) == 1 { flag = 1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::Aucune section « ## [$VERSION] » (ou vide) dans CHANGELOG.md — ajouter l'entrée avant de pousser le tag."
            exit 1
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent : release déjà créée (tag poussé + appel) → rien à faire.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::La release $TAG existe déjà."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
