name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Prepare
        run: npm ci
      - name: Test (unitaire)
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Sync optionnelle (voir docs/backend.md) : injectée au build, jamais
          # dans le repo. Sans secret, la sync reste inactive (build local, CI PR).
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
      - name: Install navigateurs e2e
        run: |
          # Le miroir apt google-chrome du runner peut être incohérent côté CDN
          # (hash sum mismatch) et fait échouer --with-deps ; Playwright n'utilise
          # pas ce repo (il télécharge ses propres builds de navigateurs).
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          npx playwright install --with-deps chromium webkit
      - name: Test e2e (build de prod, mobile)
        run: npm run e2e:preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
